# Not applied by kustomize (deliberately not listed in kustomization.yaml resources).
#
# The Deployment (app + Postgres) reads credentials from two Secrets that are
# NOT tracked in Git, on purpose — real values never belong in source control.
# Copy this file, fill in real values, and apply it by hand before deploying:
#
#   cp kubernetes/base/secrets.example.yaml /tmp/reference-platform-secrets.yaml
#   # edit /tmp/reference-platform-secrets.yaml with real values
#   kubectl apply -f /tmp/reference-platform-secrets.yaml
#
# For a repeatable, auditable alternative to this manual step, see the
# "Secrets automation" item in docs/ARCHITECTURE.md's roadmap (Sealed Secrets
# or External Secrets Operator).

apiVersion: v1
kind: Secret
metadata:
  name: reference-platform-db
  namespace: reference-platform
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: reference-platform-jwt
  namespace: reference-platform
type: Opaque
stringData:
  SECRET: CHANGE_ME_TO_A_LONG_RANDOM_VALUE
